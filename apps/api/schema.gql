type Artist {
  artistId: ID!
  artistBio: String
  artistLocation: String
  artistLatitude: Float
  artistLongitude: Float
  artistActiveYearBegin: Int
  artistActiveYearEnd: Int
  artistFavorites: Float
  artistComments: Float
}

type ArtistSummary {
  artistId: ID!
  name: String
  imageUrl: String
}

type AlbumSummary {
  albumId: ID!
  title: String
  imageUrl: String
  type: String
}

type Track {
  trackId: ID!
  title: String
  imageUrl: String
  audioSrc: String
  durationSeconds: Int
  trackNumber: Int
  discNumber: Int
  isExplicit: Boolean!
  isInstrumental: Boolean!
  listens: Float
  favorites: Float
  comments: Float
  album: AlbumSummary
  mainArtists: [ArtistSummary!]!
  featArtists: [ArtistSummary!]!
  isLiked: Boolean!
}

type Playlist {
  playlistId: ID!
  name: String
  ownerDisplayName: String
  isEditable: Boolean!
  trackCount: Int!
  tracks: [Track!]!
}

type Account {
  accountId: ID!
  login: String
  email: String
  name: String
  isArtist: Boolean!
  artist: Artist
}

type AuthPayload {
  token: String!
  account: Account!
}

input CreateAccountInput {
  login: String!
  email: String!
  password: String!
  name: String!
  isArtist: Boolean
}

input UpdateArtistInput {
  artistBio: String
  artistLocation: String
  artistLatitude: Float
  artistLongitude: Float
  artistActiveYearBegin: Int
  artistActiveYearEnd: Int
  artistFavorites: Float
  artistComments: Float
}

input UpdateAccountInput {
  login: String
  email: String
  password: String
  name: String
  isArtist: Boolean
}

input CreatePlaylistInput {
  name: String!
}

input UpdatePlaylistInput {
  name: String
}

input LoginInput {
  email: String!
  password: String!
}

type Query {
  hello: String!
  account(accountId: String!): Account
  track(trackId: String!): Track
  albumTracks(albumId: String!): [Track!]!
  artistTopTracks(artistId: String!, limit: Int): [Track!]!
  likedTracks: [Track!]!
  playlist(playlistId: String!): Playlist
  myPlaylists: [Playlist!]!
}

type Mutation {
  createAccount(input: CreateAccountInput!): Account!
  updateAccount(accountId: String!, input: UpdateAccountInput!): Account
  updateArtist(accountId: String!, input: UpdateArtistInput!): Artist
  deleteAccount(accountId: String!): Boolean!
  login(input: LoginInput!): AuthPayload
  logout: Boolean!
  likeTrack(trackId: String!): Track
  unlikeTrack(trackId: String!): Track
  createPlaylist(input: CreatePlaylistInput!): Playlist!
  updatePlaylist(playlistId: String!, input: UpdatePlaylistInput!): Playlist
  deletePlaylist(playlistId: String!): Boolean!
  addTrackToPlaylist(playlistId: String!, trackId: String!): Playlist
  removeTrackFromPlaylist(playlistId: String!, trackId: String!): Playlist
  recordTrackListen(trackId: String!): Boolean!
}
