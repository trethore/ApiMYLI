services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: myli
      POSTGRES_PASSWORD: myli
      POSTGRES_DB: myli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myli -d myli"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/seed:/workspace/seed:ro
      - ./apps/api/data:/workspace/data:ro
      - ./apps/api/prisma:/workspace/prisma:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
